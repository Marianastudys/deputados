<h1 class="titulo">Deputados</h1>

<div class="pesquisa">

    <form
        [formGroup]="formDeputados"
        (ngSubmit)="obterDeputadosPorSexo(formDeputados.value.sexo)">

        <input
            type="text"
            formControlName="sexo"
            placeholder="Digite o sexo do deputado(a)">

        @if (
            formDeputados.get('sexo')?.invalid &&
            formDeputados.get('sexo')?.touched
        ) {
            <p class="erro">
                Digite apenas F para feminino ou M para masculino, em letras maiúsculas.
            </p>
        }

        <button type="submit">
            Buscar
        </button>

    </form>
</div>
<div class="deputados">
    @for(dep of deputados(); track dep.id) {

        <div class="card-deputado">

            <p class="nome-deputado">
                {{dep.nome}}
            </p>

            <img
                [src]="dep.urlFoto"
                [alt]="'Foto de ' + dep.nome">

            <p>
                {{dep.siglaPartido}} - {{dep.siglaUf}}
            </p>
        </div>
    }
</div>
